<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>অ্যাডমিন | দোকান খাতা</title>
<style>:root{color-scheme:light dark}body{font:16px/1.45 "Noto Sans Bengali",Kalpurush,system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px}
input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #8886}button{cursor:pointer}.u{border:1px solid #8886;border-radius:12px;padding:12px;margin:10px 0}
.h{border-color:#c2410c}.b{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;background:#12805c}.h .b{background:#c2410c}.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}small{opacity:.7}</style></head><body>
<h2>👨‍💻 ব্যবহারকারী তালিকা</h2><p><small>এই পাতার ঠিকানা কাউকে দেবেন না।</small></p>
<div class="r"><input id="k" type="password" placeholder="অ্যাডমিন পাসওয়ার্ড (KEY)"><button onclick="load()">লোড করুন</button></div><p id="m"></p><div id="l"></div>
<script src="config.js"></script>
<script>
const $=s=>document.getElementById(s),U=(window.CFG||{}).scriptUrl;$('k').value=sessionStorage.k||'';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(p){if(!U){$('m').textContent='config.js এ scriptUrl বসানো হয়নি';throw 0}const r=await fetch(U+'?'+new URLSearchParams({...p,key:$('k').value}));return r.json()}
const ago=d=>{if(!d)return'-';const n=Math.floor((Date.now()-new Date(d))/864e5);return n<1?'আজ':n+' দিন আগে'};
async function load(){sessionStorage.k=$('k').value;$('m').textContent='লোড হচ্ছে…';try{const j=await api({action:'list'});if(j.error){$('m').textContent='ভুল পাসওয়ার্ড';return}
 $('m').textContent='মোট ব্যবহারকারী: '+j.users.length+' · চালু: '+j.users.filter(u=>u.status!=='hold').length;
 $('l').innerHTML=j.users.map(u=>`<div class="u ${u.status==='hold'?'h':''}"><b>${esc(u.shop)}</b> <span class="b">${u.status==='hold'?'হোল্ড':'চালু'}</span><br>${esc(u.owner)} · <a href="tel:${esc(u.phone)}">${esc(u.phone)}</a><br><small>যোগ দিয়েছেন: ${(u.reg+'').slice(0,10)} · শেষ ব্যবহার: ${ago(u.seen)} · ভার্সন ${esc(u.v)}</small>${u.msg?`<br><small>বার্তা: ${esc(u.msg)}</small>`:''}
 <div class="r">${u.status==='hold'?`<button onclick="st('${esc(u.id)}','active')">▶ চালু করুন</button>`:`<button onclick="hold('${esc(u.id)}')">⏸ হোল্ড করুন</button>`}<button onclick="del('${esc(u.id)}')">🗑️ মুছুন</button></div></div>`).join('')}catch(e){$('m').textContent='সংযোগ ব্যর্থ'}}
async function st(id,s,msg){await api({action:'set',id,status:s,msg:msg||''});load()}
function hold(id){const m=prompt('ইউজারকে যে বার্তা দেখাবেন:','আপনার অ্যাপ সাময়িক বন্ধ আছে। অনুগ্রহ করে যোগাযোগ করুন।');if(m!==null)st(id,'hold',m)}
async function del(id){if(confirm('তালিকা থেকে মুছবেন? (ইউজারের ফোনের ডাটা মুছবে না)')){await api({action:'del',id});load()}}
if($('k').value)load();
</script></body></html>
