<script>
const C=window.CFG||{},$=s=>document.querySelector(s),K='dokan_v1',D='০১২৩৪৫৬৭৮৯';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S={shop:'',pin:'',parties:[],tx:[],cb:[],nd:[],lb:0,seen:0,uid:'',owner:'',ph:'',logo:'',st:'active',hm:'',...(S||{})};

const G=[["১. শুরু করার নিয়ম", "অ্যাপ খুলে প্রথমে উপরের ⚙️ থেকে <b>দোকানের নাম</b> লিখে রাখুন। তারপর গ্রাহক বা সরবরাহকারী যোগ করুন, আর রোজকার বিক্রি-ক্রয় ঘরে লিখুন। সব তথ্য শুধু আপনার ফোনেই থাকে।"], ["২. গ্রাহক ও সরবরাহকারী যোগ করা", "• <b>👥 গ্রাহক</b> ট্যাবে হলুদ <b>＋ নতুন গ্রাহক</b> চাপুন। যাদের কাছে মাল কেনেন তাদের জন্য <b>🚚 সরবরাহকারী</b> ট্যাব।<br>• নাম লিখুন (🎤 চেপে বলেও লেখা যায়), মোবাইল নম্বর ও ঠিকানা ঐচ্ছিক।<br>• <b>ছবি:</b> দরকার হলে 📷 বোতামে ছবি তুলুন বা গ্যালারি থেকে বাছুন। ছবি না দিলে নামের প্রথম অক্ষর দেখাবে।<br>• <b>ক্রেডিট সীমা:</b> গ্রাহকের জন্য সর্বোচ্চ কত বাকি দেবেন লিখে রাখলে, সীমা ছাড়ালে অ্যাপ সতর্ক করবে।<br>• তথ্য বদলাতে গ্রাহকের পাতায় ✏️ চাপুন।"], ["৩. বাকি ও জমা লেখা", "গ্রাহকের নামে ট্যাপ করে তার খাতা খুলুন।<br>• <b>বাকি দিলাম</b> (লাল বোতাম): মাল বা টাকা বাকিতে দিলে।<br>• <b>টাকা পেলাম</b> (সবুজ বোতাম): গ্রাহক টাকা দিলে।<br>• টাকার ঘরে যোগও করা যায়, যেমন <b>200+300</b>।<br>• বাকির সময় <b>তাগাদার তারিখ</b> দিলে সেই দিন ⏰ সতর্কতা আসবে।<br>• ভুল হলে লেনদেনে ট্যাপ করে এডিট বা মুছুন।<br>• সরবরাহকারীর খাতায় বোতাম দুটি: <b>বাকিতে নিলাম</b> ও <b>টাকা দিলাম</b>।"], ["৪. বিক্রি বক্স", "উপরের নীল ট্যাবের নিচে সবুজ <b>💰 বিক্রি বক্স</b> বোতাম আছে।<br>• <b>কার কাছে:</b> নগদ বিক্রি হলে \"নগদ (নাম ছাড়া)\" রাখুন। বাকিতে হলে গ্রাহকের নাম বাছুন।<br>• মালের বিবরণ ও মোট টাকা লিখুন।<br>• গ্রাহক বাছলে \"এখনই নগদ পেলাম\" ঘরে যা পেয়েছেন লিখুন। বাকি কত থাকবে, অ্যাপ নিজেই দেখাবে। ঘর ফাঁকা রাখলে পুরোটাই বাকি লেখা হবে।<br>• <b>সংরক্ষণ</b> চাপলেই এন্ট্রি হয়ে যায়। নগদ বিক্রি আজকের হিসাবে আর বাকি বিক্রি গ্রাহকের খাতায় যায়।"], ["৫. ক্রয় বক্স", "নীল <b>📦 ক্রয় বক্স</b> বোতামে মাল কেনার হিসাব লিখুন।<br>• সরবরাহকারীর নাম বাছলে মাল কেনার পুরো টাকা তার খাতায় বাকি হিসেবে ওঠে। এখনই যা দিয়েছেন \"এখনই নগদ দিলাম\" ঘরে লিখুন।<br>• নাম না বাছলে সেটি নগদ কেনা, আজকের হিসাবে খরচ ধরা হয়।<br>• এই কেনার টাকা রিপোর্টে খরচের সাথে ধরে লাভ-ক্ষতি হিসাব হয়।<br>• দোকানের অন্য খরচ (বিদ্যুৎ, ভাড়া ইত্যাদি) \"আজকের হিসাব\" ট্যাবের <b>＋ অন্যান্য খরচ</b> বোতামে লিখুন।"], ["৬. তাগাদা
